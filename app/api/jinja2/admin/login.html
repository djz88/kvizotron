{% extends theme.layout_template() %}
{% block content %}
<nav aria-label="{{ _('Language') }}">
  <ul>
    <li><a href="?lang=cs" lang="cs">Čeština</a></li>
    <li><a href="?lang=en" lang="en">English</a></li>
  </ul>
</nav>
<h1>{{ _("Log in") }}</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
  {{ csrf_input }}
  {{ form.as_div() }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">{{ _("Log in") }}</button>
</form>
{% endblock %}
