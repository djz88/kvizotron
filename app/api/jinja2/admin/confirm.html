{% extends "admin/base.html" %}
{% block content %}
<h1>{{ _("Please confirm") }}</h1>
<p>{{ message }}</p>
<form method="post" action="{{ action }}">
  {{ csrf_input }}
    {% for name, value in (hidden|default({})).items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
    {% for name, value in (repeated|default([])) %}<input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
  <input type="hidden" name="confirm" value="1">
  <button type="submit">{{ _("Confirm") }}</button>
  <a href="{{ cancel if cancel is defined else url('admin_quiz_edit', args=[quiz.id]) }}" role="button" class="secondary">{{ _("Cancel") }}</a>
</form>
{% endblock %}
