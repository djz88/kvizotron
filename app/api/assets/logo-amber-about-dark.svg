<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="KvízoTron – kompletní logo s KT emblémem, integrovaným názvem a třemi kvízovými ikonami – Solar Amber dark">
  <title>KvízoTron – kompletní logo – Solar Amber (dark)</title>
  <desc>Úplné vektorové logo: nahoře KT s orbitou a hvězdou, uprostřed KvízoTron se zvýrazněnými K a T, dole otazník, fajfka a trofej. Pozadí je transparentní. Vše je SVG path/gradient, žádný bitmapový obrázek ani externí font.</desc>
