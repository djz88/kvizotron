{% set control = "checkbox" if q.multiple else "radio" %}
<fieldset>
  <legend>{{ q.prompt }}{% if q.count %} <small>({{ _("choose %(count)s", count=q.count) }})</small>{% endif %}</legend>
  {% if q.image %}<img src="{{ q.image.url }}" alt="{{ q.image.alt }}" loading="lazy" referrerpolicy="no-referrer" class="question-image">{% endif %}
  {% for option in q.options %}
  <label>
    <input type="{{ control }}" name="{{ q.id }}:options[]" value="{{ option.id }}"{% if option.id in ticked %} checked{% endif %}>
    {% if option.image %}<img src="{{ option.image.url }}" alt="{{ option.image.alt }}" loading="lazy" referrerpolicy="no-referrer" class="option-image">{% endif %}
    {{ option.text }}
  </label>
  {% endfor %}
  {% if q.offer_none %}
  <label>
    {% if q.multiple %}
    <input type="checkbox" data-none name="{{ q.id }}:none" value="1"{% if none_ticked %} checked{% endif %}>
    {% else %}
    <input type="radio" data-none name="{{ q.id }}:options[]" value="none"{% if none_ticked %} checked{% endif %}>
    {% endif %}
    {{ _("None of the answers") }}
  </label>
  {% endif %}
</fieldset>
