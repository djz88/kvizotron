[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "kvizotron"
version = "1.0.0"
description = "Self-hosted multilingual quiz and competition platform"
requires-python = ">=3.15,<3.16"
license = "GPL-3.0-or-later"
dependencies = [
    "argon2-cffi==25.1.0",
    "django==6.1.3",
    "gunicorn==26.2.0",
    "jinja2==3.1.6",
    "packaging==26.3",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "segno==1.6.6",
]

[project.entry-points."kvizotron.modules"]
"auth.local" = "app.providers.auth_local.manifest:MANIFEST"
"flow.basic" = "app.plugins.quiz_flow.manifest:MANIFEST"
"quiz_types.basic" = "app.plugins.quiz_types.manifest:MANIFEST"
"participants.basic" = "app.plugins.participants.manifest:MANIFEST"
"results.local" = "app.plugins.results.manifest:MANIFEST"
"rewards.threshold" = "app.plugins.rewards.manifest:MANIFEST"
"drawings.manual" = "app.plugins.drawings.manifest:MANIFEST"
"media.local" = "app.providers.media_local.manifest:MANIFEST"
"csv.io" = "app.providers.csv_io.manifest:MANIFEST"
"retention.local" = "app.providers.retention.manifest:MANIFEST"
"persistence.sqlite" = "app.providers.persistence_sqlite.manifest:MANIFEST"
"question.choice" = "app.plugins.questions.choice.manifest:MANIFEST"
"question.image_answer" = "app.plugins.questions.image_answer.manifest:MANIFEST"
"question.matching" = "app.plugins.questions.matching.manifest:MANIFEST"
"question.number" = "app.plugins.questions.number.manifest:MANIFEST"
"question.text" = "app.plugins.questions.text.manifest:MANIFEST"
"scoring.basic" = "app.plugins.scoring.manifest:MANIFEST"
"theme.default" = "app.plugins.theme_default.manifest:MANIFEST"

[dependency-groups]
dev = [
    "babel==2.18.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.5",
]

[tool.uv]
required-version = ">=0.13.7"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]
"**/migrations/*" = ["E501"]  # generated by Django

[tool.mypy]
python_version = "3.15"
files = ["app"]
exclude = ["migrations/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
